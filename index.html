<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWAG</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
 
  <style>
    :root {
      --red: #C41E3A;
      --red-glow: rgba(196,30,58,0.4);
      --white: #f5f0eb;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#000;
      color:var(--white);
      font-family:'Barlow Condensed', sans-serif;
      overflow:hidden;
      cursor:none;
    }

    /* Cursor */
    .cursor-ring {
      position:fixed; width:40px; height:40px;
      border:1px solid var(--red); border-radius:50%;
      pointer-events:none; z-index:9999;
      transform:translate(-50%,-50%);
      mix-blend-mode:exclusion;
      opacity:0.7;
    }
    .cursor-dot {
      position:fixed; width:6px; height:6px;
      background:var(--red); border-radius:50%;
      pointer-events:none; z-index:9999;
      transform:translate(-50%,-50%);
    }

    /* Video */
    #videoWrapper {
      position:fixed; inset:0; z-index:1;
      overflow:hidden;
      transition: opacity 2.5s ease-out;
    }
    #mainVideo {
      position:absolute; top:50%; left:50%;
      width:110%; height:110%;
      object-fit:cover;
      transform:translate(-50%,-50%);
    }

    /* Overlays */
    .vignette, .scanlines, .grain, .flicker {
      position:fixed; inset:0; pointer-events:none;
    }
    .vignette { background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.88) 100%); z-index:5; }
    .scanlines { z-index:6; background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px); animation:scanShift 12s linear infinite; }
    @keyframes scanShift { 0% { background-position:0 0; } 100% { background-position:0 100px; } }
    .grain { z-index:7; opacity:0.035; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); animation:grainMove 0.5s steps(2) infinite; }
    @keyframes grainMove { 0%,100% { transform:translate(0,0); } 50% { transform:translate(2%,3%); } }
    .flicker { background:var(--red); mix-blend-mode:multiply; opacity:0; z-index:8; }

    .timecode {
      position:fixed; bottom:24px; left:32px; z-index:30;
      font-family:'Barlow Condensed', monospace; font-size:0.75rem;
      letter-spacing:2px; opacity:0.3;
    }
    .subtitle {
      position:fixed; bottom:9%; left:50%; transform:translateX(-50%);
      font-size:1.5rem; font-weight:500; letter-spacing:5px;
      text-transform:uppercase; z-index:30; white-space:nowrap;
      text-shadow:0 0 40px rgba(0,0,0,0.9);
      opacity:0; transition:opacity 0.6s;
    }
    .subtitle.show { opacity:1; }

    /* CALL BOX - CENTERED + BLUR */
    .call-box {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translateY(30px);
      background: rgba(8, 8, 8, 0.96);
      border-left: 4px solid var(--red);
      padding: 32px 44px;
      border-radius: 4px;
      display: none;
      align-items: center;
      gap: 36px;
      z-index: 60;
      min-width: 440px;
      opacity: 0;
      transition: all 0.7s cubic-bezier(0.23,1,0.32,1);
      box-shadow: 0 0 90px rgba(196,30,58,0.35), 0 40px 70px rgba(0,0,0,0.95);
      filter: blur(14px);
      backdrop-filter: blur(10px);
    }
    .call-box.show {
      opacity: 1;
      transform: translate(-50%, -50%);
      filter: blur(0px);
    }

    .call-label { font-size:0.7rem; letter-spacing:4px; color:var(--red); margin-bottom:6px; }
    .call-name { font-family:'Bebas Neue'; font-size:2.6rem; letter-spacing:3px; }
    .call-status { font-size:0.85rem; letter-spacing:2px; opacity:0.6; margin-top:6px; }
    .call-dot { display:inline-block; width:7px; height:7px; background:var(--red); border-radius:50%; margin-right:8px; animation:blink 1.2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    .call-btn {
      padding:12px 28px; font-weight:700; letter-spacing:3px;
      text-transform:uppercase; border:1.5px solid; border-radius:2px;
      cursor:pointer; transition:all 0.3s;
    }
    #answer { border-color:var(--red); color:white; }
    #answer:hover { background:var(--red); }
    #decline { border-color:#444; color:#888; }

    /* CHOICES */
    .choice-container {
      position:fixed; inset:0; display:none; align-items:center; justify-content:center;
      gap:0; z-index:70;
    }
    .choice {
      flex:1; height:100vh; position:relative; overflow:hidden;
      cursor:pointer; border-right:1px solid rgba(196,30,58,0.2);
      transition:flex 0.6s cubic-bezier(0.23,1,0.32,1);
    }
    .choice:last-child { border-right:none; }
    .choice:hover { flex:2; }
    .choice-bg video { width:100%; height:100%; object-fit:cover; opacity:0.6; }
    .choice-overlay {
      position:absolute; inset:0;
      background:linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 60%);
    }
    .choice-content {
      position:absolute; bottom:15%; left:50%; transform:translateX(-50%);
      text-align:center;
    }
    .choice-line {
      width:30px; height:1.5px; background:var(--red);
      margin:0 auto 16px; transition:width 0.4s;
    }
    .choice-label {
      font-family:'Bebas Neue'; font-size:3.5rem; letter-spacing:4px;
    }
    .choice:hover .choice-line { width:60px; }
    .choice:hover .choice-label { letter-spacing:8px; }

    /* FINAL SCREEN */
    .final-screen {
      position:fixed; inset:0; background:#000; display:none;
      align-items:center; justify-content:center; flex-direction:column;
      z-index:100; text-align:center; padding:40px;
    }
    .final-headline {
      font-family:'Bebas Neue'; font-size:clamp(3rem,8vw,7rem);
      letter-spacing:-1px; line-height:0.9; opacity:0;
      transition:opacity 0.8s, transform 0.8s;
    }
    .final-headline.show { opacity:1; transform:translateY(0); }
    .final-sub { font-size:0.9rem; letter-spacing:6px; opacity:0; color:var(--red); text-transform:uppercase; transition:opacity 0.8s 0.3s; }
    .final-sub.show { opacity:0.7; }

    .form-wrap {
      margin-top:40px; width:min(420px, 90vw);
      opacity:0; transition:opacity 0.8s 0.5s;
    }
    .form-wrap.show { opacity:1; }
    .field { margin-bottom:16px; }
    .field input, .field textarea {
      width:100%; background:rgba(255,255,255,0.03);
      border:none; border-bottom:1px solid rgba(196,30,58,0.4);
      color:var(--white); padding:14px 0; font-size:1.1rem;
      letter-spacing:2px; text-transform:uppercase; outline:none;
    }
    .submit-btn {
      margin-top:30px; width:100%; padding:18px;
      background:transparent; border:1.5px solid var(--red);
      color:var(--white); font-family:'Bebas Neue';
      font-size:1.6rem; letter-spacing:5px; cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="cursor-ring" id="cursorRing"></div>
  <div class="cursor-dot" id="cursorDot"></div>

  <div id="videoWrapper">
    <video id="mainVideo" autoplay muted playsinline>
      <source src="https://i.imgur.com/DCMK44t.mp4" type="video/mp4">
    </video>
  </div>

  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div class="grain"></div>
  <div class="flicker" id="flicker"></div>

  <div class="timecode" id="timecode">00:00:00:00</div>
  <div class="subtitle" id="subtitle"></div>

  <!-- CALL BOX -->
  <div class="call-box" id="callBox">
    <div>
      <div class="call-label">INCOMING TRANSMISSION</div>
      <div class="call-name">SWAG</div>
      <div class="call-status"><span class="call-dot"></span>CONNECTING...</div>
    </div>
    <div>
      <button class="call-btn" id="answer">ANSWER</button>
      <button class="call-btn" id="decline">DECLINE</button>
    </div>
  </div>

  <!-- CHOICES -->
  <div class="choice-container" id="choices">
    <div class="choice" data-choice="join">
      <div class="choice-bg"><video src="YOUR_JOIN_LINK.mp4" muted loop playsinline></video></div>
      <div class="choice-overlay"></div>
      <div class="choice-content">
        <div class="choice-line"></div>
        <span class="choice-label">JOIN</span>
        <span class="choice-sub">Become the movement</span>
      </div>
    </div>
    <div class="choice" data-choice="observe">
      <div class="choice-bg"><video src="YOUR_OBSERVE_LINK.mp4" muted loop playsinline></video></div>
      <div class="choice-overlay"></div>
      <div class="choice-content">
        <div class="choice-line"></div>
        <span class="choice-label">OBSERVE</span>
        <span class="choice-sub">Watch from the dark</span>
      </div>
    </div>
    <div class="choice" data-choice="run">
      <div class="choice-bg"><video src="YOUR_RUN_LINK.mp4" muted loop playsinline></video></div>
      <div class="choice-overlay"></div>
      <div class="choice-content">
        <div class="choice-line"></div>
        <span class="choice-label">RUN</span>
        <span class="choice-sub">They'll find you anyway</span>
      </div>
    </div>
  </div>

  <!-- FINAL SCREEN -->
  <div class="final-screen" id="final">
    <div class="final-headline" id="finalHeadline">YOU HAVE BEEN<br>SELECTED</div>
    <div class="final-sub" id="finalSub">The movement found you.</div>
    <div class="form-wrap" id="formWrap">
      <div class="field"><input type="text" placeholder="NAME"></div>
      <div class="field"><input type="text" placeholder="EMAIL OR WHATSAPP"></div>
      <div class="field"><textarea placeholder="WHY DO YOU WANT SWAG?"></textarea></div>
      <button class="submit-btn" onclick="enterMovement()">ENTER THE MOVEMENT</button>
    </div>
  </div>

  <script>
    const videoWrap = document.getElementById('videoWrapper');
    const video = document.getElementById('mainVideo');
    const callBox = document.getElementById('callBox');
    const choices = document.getElementById('choices');
    const final = document.getElementById('final');
    const subtitle = document.getElementById('subtitle');
    const flicker = document.getElementById('flicker');

    let mx = 0, my = 0, rx = 0, ry = 0;

    // Cursor
    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      rx += (mx - rx) * 0.16;
      ry += (my - ry) * 0.16;
      document.getElementById('cursorRing').style.left = rx + 'px';
      document.getElementById('cursorRing').style.top = ry + 'px';
      document.getElementById('cursorDot').style.left = mx + 'px';
      document.getElementById('cursorDot').style.top = my + 'px';
    });

    // Video ends → fade to black
    video.addEventListener('ended', () => {
      videoWrap.style.opacity = '0';
      setTimeout(() => video.pause(), 2500);
    });

    // Random glitch
    function randomGlitch() {
      if (Math.random() < 0.25) {
        flicker.style.opacity = '0.08';
        setTimeout(() => flicker.style.opacity = '0', 90);
      }
      setTimeout(randomGlitch, 4000 + Math.random() * 9000);
    }
    randomGlitch();

    // Timecode
    setInterval(() => {
      const n = new Date();
      const pad = v => String(v).padStart(2,'0');
      document.getElementById('timecode').textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}:${pad(Math.floor(n.getMilliseconds()/10))}`;
    }, 80);

    // Show Call
    setTimeout(() => {
      subtitle.textContent = "A PHONE IS RINGING...";
      subtitle.classList.add('show');
      callBox.style.display = 'flex';
      setTimeout(() => callBox.classList.add('show'), 150);
    }, 7500);

    // Answer
    document.getElementById('answer').addEventListener('click', () => {
      callBox.style.opacity = '0';
      setTimeout(() => {
        callBox.style.display = 'none';
        subtitle.classList.remove('show');
        subtitle.textContent = "YOU WEREN'T SUPPOSED TO FIND US...";
        subtitle.classList.add('show');

        setTimeout(() => {
          choices.style.display = 'flex';
        }, 2500);
      }, 600);
    });

    // Decline (optional shake)
    document.getElementById('decline').addEventListener('click', () => {
      subtitle.textContent = "THE RINGING GETS LOUDER...";
      subtitle.classList.add('show');
    });

    // Choices
    document.querySelectorAll('.choice').forEach(el => {
      el.addEventListener('click', () => {
        const choice = el.dataset.choice;
        choices.style.display = 'none';
        final.style.display = 'flex';

        document.getElementById('finalHeadline').classList.add('show');
        document.getElementById('finalSub').classList.add('show');
        document.getElementById('formWrap').classList.add('show');
      });
    });

    function enterMovement() {
      const btn = document.querySelector('.submit-btn');
      btn.innerHTML = "WELCOME TO THE MOVEMENT";
      btn.style.borderColor = '#fff';
      btn.style.color = '#fff';
    }

    // Restart
    document.addEventListener('keydown', e => {
      if (e.key.toLowerCase() === 'r') location.reload();
    });
  </script>
</body>
</html>
